narrative_hint: |
  【Manim 画面描述规范——弱技术层】
  description 和 beats[].visual_action 只写画面意图，由代码生成阶段翻译为 Manim 动画代码。禁止出现 Manim 类名、变量名或代码语法。

  【语义表达要求】
  - description 概括整个镜头的视觉论证目标，visual_action 只描述当前 cue_text 对应的变化
  - 优先描述位置、数量、大小、连接、分裂、聚合、替换和状态变化，让动画承担解释功能
  - 前一 beat 的视觉结果应成为后一 beat 的输入，不在每个 beat 重新搭建画面
  - 元素完成叙事使命、即将被替换或会遮挡重点时才退场；只描述退场意图
  - 关键图形和结果至少保留到对应 cue_text 结束
  - 文字只保留关键词、数字、公式和短标注；先用图形解释，只在必要时使用公式

  【description 画面描述契约】
  description 是代码生成阶段唯一的画面依据，尽可能详尽，必须像施工图一样完整覆盖以下五要素，
  使用自然语言和相对位置词描述：
  ① 初始状态：镜头开始时画面上已有什么（来自上一镜头的保留元素及其位置）；
     若为清场新镜头则明确写"空画面，仅背景"。
  ② 元素清单：本镜头出现的每个视觉元素逐个写明——形状/类型、颜色（用视觉系统中的颜色名）、
     位置（九宫格方位：左上/顶部居中/中部/右下等，及相对其他元素的关系）、
     数量与排布（如"一排 15 个、水平等距、位于画面中部水平带"）。
  ③ 动画时序：元素以什么顺序、什么方式出现或变化
     （原地放大出现/淡入/生长绘制/变色/变幽灵态/放大强调），
     哪些动作同时发生、哪些先后发生，与哪个 beat 对齐。
  ④ 状态语义：每次视觉变化代表什么信息含义（如被排除→幽灵态、被选中→高亮放大），
     保证画面变化与旁白逻辑一一对应。
  ⑤ 结束定格：镜头结束时的最终画面构成，以及哪些元素需要保留给下一镜头。

  反例与正例：
  ✗ "展示多个候选人被逐一排除"
  ✓ "画面中部一排 12 个人物图标（主体色循环）已存在；随旁白从左到右前 5 个
     依次变为幽灵态（每个间隔约 0.2 秒），第 6 个同时放大高亮为金黄，
     其上方淡入小标注'当前最优'；结束定格保留整排状态供下一镜头使用"

  【beat 动画密度要求（防止画面静止）】
  一句旁白通常持续 4-6 秒，而单个动作只有约 0.5 秒——visual_action 若只写一个瞬时动作，剩余时间画面将完全静止。因此：
  - visual_action 必须是覆盖整句旁白时长的连续动作链，由 2-3 个衔接的微动作组成：主动作（新元素出现/状态变化）→ 跟随动作（标注淡入/连线生长/计数变化）→ 强调动作（关键对象放大/变色/描边）
  - 长句 beat 优先使用过程性动画，让画面在整句期间持续演化：群体元素逐个入场、状态从左到右扫过、数值从零增长到目标、路径/曲线逐段绘制、区域逐步填充
  - 除收尾镜头的刻意留白外，任何镜头不得出现超过 2 秒的画面完全静止
  - 一句旁白至少两个beat，若旁白中间有停顿或转折，可拆成更多 beat，让画面在整句期间持续演化。严禁偷懒，因为这会让画面静止！！
  - 自检：读每个 visual_action，若它描述的动作 1 秒内就能播完，说明动作链不够，必须补跟随动作或改为过程性动画

  反例与正例：
  ✗ "计数器显示为 37%"（瞬时动作，之后静止 5 秒）
  ✓ "计数器从 0% 连续增长到 37%（约 2 秒），到达时数字放大定格并变为
     金黄，随后其下方淡入短标注，右侧对应的柱形同步生长到相应高度"

code_prompt: |
  【Manim 代码规范】

  渲染引擎已生成外层结构（from manim import *、Scene 类定义、construct() 等），code 字段只写 construct() 方法体内的代码片段：

        # === 镜头 0 ===
        <scene 0 的 code>
        # === 镜头 1 ===
        <scene 1 的 code>
        ...

  禁止在 code 里写 import 语句、def construct、或结构定义。

  【语义节拍时间翻译】
  - 按 beats 顺序维护镜头内的相对时间游标；前一 beat 的最终画面是后一 beat 的起始状态
  - animation_start_seconds 是动作开始锚点，animation_end_seconds 是该 beat 主要动作完成的最晚时间
  - 当前游标早于下一 beat 的 animation_start_seconds 时，只等待两者差值；禁止把这些等待集中到镜头末尾
  - 每个 beat 的 self.play(run_time=...) 总时长不得超过自己的动画窗口
  - 若窗口不足以容纳复杂动作，简化次要装饰，优先保证主要视觉结果在 speech_end_seconds 前出现
  - 不得在第一个 beat 中创建或完成后续 beats 才应出现的元素

  【动画窗口填充率（防止 PPT 感，与时长上限同等重要）】
  - 每个 beat 的动画时间（所有 run_time 之和，含错落间隔）必须覆盖该 beat
    窗口的 70% 以上；窗口内单次 self.wait 不得超过 1.0 秒
  - 禁止"一个短 play + 长 wait"的偷懒结构；一个 beat 至少拆成 2-3 次
    self.play：主动作 → 跟随标注/连线 → 强调，动作之间才允许短暂停留
  - 窗口时间富余时，通过拉长过程性动画消化：群体动画用 LaggedStart 并
    增大 lag_ratio、数值增长/曲线绘制延长 run_time、状态扫过放慢节奏；
    宁可让动作变慢变从容，也不要动作播完后干等
  - 计数、生长、扫过类动画的 run_time 应设为窗口的 40%-60%，
    而不是默认的 1 秒

  【动画时序规则】
  - 用 self.wait(n) 控制停留时长，单位秒
  - 每个镜头 code 的所有 self.play(run_time=...) 与 self.wait(...) 之和需与该镜头 estimated_duration_seconds 匹配（误差 ±1s 可接受）
  - 关键图形和结论必须至少保留到对应旁白讲完；禁止旁白尚未结束就清空画面
  - 渲染器会自动补齐镜头剩余时长。如果本镜头没有必要的退场或转场，代码末尾保持最终画面即可，不要添加 FadeOut 清场

  【变量生命周期规则】
  - scene 0 声明的变量在 scene 1、2... 中仍在作用域内，可直接引用
  - 元素默认可跨镜头保留；镜头边界不等于清场点，不要为了结束当前镜头而机械 FadeOut
  - 仅当元素完成叙事作用、即将被新内容替代或会遮挡后续重点时，才在合适的转场时机用 FadeOut 退场
  - 若下一镜头复用某元素（变形/移动/替换），用 Transform / ReplacementTransform / .animate，不要重新声明同名变量
  - 禁止在不同镜头中对同一逻辑元素重复声明同名变量

  【画布安全区（重要）】
  - Manim 默认画布：14.2 × 8 单位（宽×高），坐标原点在中心
  - 安全区：x ∈ [-6.0, 6.0]，y ∈ [-3.5, 3.5]，距边缘至少 0.3 单位缓冲
  - 所有元素创建后必须确认坐标在安全区内，禁止超出此范围
  - 多元素布局用 VGroup(...).arrange() 或明确 .shift() 定位，不依赖默认位置叠加
  - 大型 VGroup 用 .scale_to_fit_width(11) 限制最大宽度

  【坐标轴（Axes）专项安全规则——高频溢出场景】
  Axes 是最容易导致内容溢出的对象，必须遵守以下规则：
  - 必须显式设置 x_length 和 y_length，禁止使用默认尺寸： axes = Axes(x_range=[0,10,1], y_range=[0,1,0.2], x_length=9, y_length=5)
  - 创建后必须立即用 .move_to(ORIGIN) 或 .shift() 定位，不依赖默认位置：axes.move_to(ORIGIN).shift(RIGHT * 0.5)  # 为左侧 y 轴标签留出空间
  - y 轴标签天然向左偏移约 1 单位，整体 Axes 须向右平移至少 0.8 单位，防止标签溢出左边缘：axes.shift(RIGHT * 0.8)  # y 轴标签最终 x 位置 ≈ axes 左边缘 x - 1.2，必须 ≥ -6.0
  - 轴标签用 font_size=22 以内，创建后检查 label.get_left()[0] ≥ -5.8、label.get_right()[0] ≤ 5.8
  - 图形（Graph/ParametricFunction）绘制范围必须在轴的 x_range/y_range 之内，不要超出轴域：graph = axes.plot(lambda x: 1/x, x_range=[0.1, 9.9])  # 严格在 x_range 内
  - 如果同一画面有标题或其他元素，Axes 整体缩小或位移，确保与其他元素无重叠且各自在安全区内

  【文字元素防溢出规则】
  - 所有 Text / MathTex 在 .play(Write/FadeIn...) 前必须确认 get_left()[0] ≥ -5.8 且 get_right()[0] ≤ 5.8
  - 长文字必须先 .scale() 到合适大小再定位，不要先定位再期望 font_size 自动控制宽度
  - 跨镜头保留的文字（如标题）在移动到新位置后同样必须满足安全区约束
  - .to_corner() / .to_edge() 自带 buff=0.5，安全；但 .move_to() / .shift() 到边缘位置时须手动验证不超界

  【坐标系规则（重要）——高频报错根源】
  - Manim 所有"点"均为三维 (x, y, z)，z 通常为 0；这是全局约束，无例外
  - 凡是传递坐标/顶点/路径点的地方，一律用 3 元素格式：[x, y, 0] 或 np.array([x, y, 0])
  - 严禁任何形式的 2D 坐标：[x, y]、np.array([x, y]) 均会导致 shape broadcast 错误
  - Axes 构造函数不支持 x_label / y_label 参数；先创建 axes，再用 axes.get_x_axis_label() / axes.get_y_axis_label()

  【文字渲染规则（重要）】
  - 所有中文、日文等非 ASCII 文字必须使用 Text()，禁止使用 MathTex() 或 Tex()
  - MathTex() / Tex() 仅用于纯英文/ASCII 数学公式（如 r"E=mc^2"、r"\frac{{1}}{{2}}"）
  - 中英文混排时，中文用 Text()，公式用 MathTex()，再用 VGroup 组合
  - 违反此规则会导致 LaTeX 编译报错使视频生成失败

  【退场检查清单（每个镜头必须执行）】
  每个镜头代码开头，隐式维护画布存量列表，对每个存活元素判断：
  - 本镜头继续引用或保留 → 不退场，直接使用
  - 已完成使命且本镜头不再出现 → 镜头开头 FadeOut(run_time=0.5)
  - 位置与本镜头新元素重叠 → 镜头开头 FadeOut 或 ReplacementTransform
  - 背景性持续元素（如顶部标题） → 保留，除非叙事需要替换

  退场动画统一放在本镜头开头（先清场，再出新内容）。

  【代码注释格式】
  # === 镜头 N ===
  # 画布存量：[元素列表]
  # [元素] → 退场/保留，原因：[一句话]

  【重要自检】
   - 第一个镜头根据 description 设置背景
   - 写代码前必须确认：所有使用的类名均来自 from manim import * 的命名空间，不要凭直觉命名。方法参数亦是如此，不可使用不存在的参数！！！
   - 变量务必先声明再使用！！！
