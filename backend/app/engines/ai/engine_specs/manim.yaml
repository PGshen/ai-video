narrative_hint: |
  【Manim 画面描述规范——弱技术层】
  description 和 beats[].visual_action 只写画面意图，由代码生成阶段翻译为 Manim 动画代码。禁止出现 Manim 类名、变量名或代码语法。

  【语义表达要求】
  - description 概括整个镜头的视觉论证目标，visual_action 只描述当前 cue_text 对应的变化
  - 优先描述位置、数量、大小、连接、分裂、聚合、替换和状态变化，让动画承担解释功能
  - 前一 beat 的视觉结果应成为后一 beat 的输入，不在每个 beat 重新搭建画面
  - 元素完成叙事使命、即将被替换或会遮挡重点时才退场；只描述退场意图
  - 关键图形和结果至少保留到对应 cue_text 结束
  - 文字只保留关键词、数字、公式和短标注；先用图形解释，只在必要时使用公式

  【description 画面描述契约】
  description 是代码生成阶段唯一的画面依据，必须让代码生成阶段无需猜测即可还原画面。
  以下五类是每个镜头必须覆盖的信息内容，不是必须分条罗列的写作模板——用连贯的自然语言组织即可，
  只要五类信息都能被读出；某类信息本镜头明显不适用时（如清场镜头没有"元素清单"）可用一句话带过，不必强行展开：
  ① 初始状态：声明哪些上一镜头的元素需要退场（后续不再使用的元素，及时退出避免元素堆积）；镜头开始时画面上已有什么（来自上一镜头的保留元素及其位置）；
     若为清场新镜头则明确写"空画面，仅背景"。
  ② 元素清单：本镜头出现的每个视觉元素逐个写明——形状/类型、颜色（用视觉系统中的颜色名）、
     位置（九宫格方位：左上/顶部居中/中部/右下等，及相对其他元素的关系）、
     数量与排布（如"一排 15 个、水平等距、位于画面中部水平带"）。
  ③ 动画时序：元素以什么顺序、什么方式出现或变化，哪些动作同时发生、哪些先后发生，与哪个 beat 对齐。
     具体的入场/强调/状态转换方式（放大/淡入/生长绘制/变色/虚化/描边等）以本项目视觉与动画风格组件
     规定的词汇为准，不要套用与本项目风格无关的动作词。
  ④ 状态语义：每次视觉变化代表什么信息含义（如被排除→弱化态、被选中→高亮放大，具体呈现方式仍以本项目
     风格组件为准），保证画面变化与旁白逻辑一一对应。
  ⑤ 结束定格：镜头结束时的最终画面构成，以及哪些元素需要保留给下一镜头。

  反例与正例（示例中的具体动作、色彩措辞仅为格式示范，实际视觉语言以本项目风格组件为准，不要照抄示例用词）：
  ✗ "展示多个候选人被逐一排除"
  ✓ "画面中部一排 12 个人物图标（主体色循环）已存在；随旁白从左到右前 5 个
     依次弱化为低对比状态（每个间隔约 0.2 秒），第 6 个同时放大高亮为金黄，
     其上方淡入小标注'当前最优'；结束定格保留整排状态供下一镜头使用"

  【beat 动画密度要求（防止画面静止）】
  一句旁白通常持续 4-6 秒，而单个动作只有约 0.5 秒——visual_action 若只写一个瞬时动作，剩余时间画面将完全静止。因此：
  - visual_action 必须是覆盖整句旁白时长的连续动作链，由 2-3 个衔接的微动作组成：主动作（新元素出现/状态变化）→ 跟随动作（标注淡入/连线生长/计数变化）→ 强调动作（关键对象放大/变色/描边）
  - 长句 beat 优先使用过程性动画，让画面在整句期间持续演化：群体元素逐个入场、状态从左到右扫过、数值从零增长到目标、路径/曲线逐段绘制、区域逐步填充
  - 除收尾镜头的刻意留白外，任何镜头不得出现超过 2 秒的画面完全静止
  - 一句旁白至少两个beat，若旁白中间有停顿或转折，可拆成更多 beat，让画面在整句期间持续演化。严禁偷懒，因为这会让画面静止！！
  - 自检：读每个 visual_action，若它描述的动作 1 秒内就能播完，说明动作链不够，必须补跟随动作或改为过程性动画

  反例与正例：
  ✗ "计数器显示为 37%"（瞬时动作，之后静止 5 秒）
  ✓ "计数器从 0% 连续增长到 37%（约 2 秒），到达时数字放大定格并变为
     金黄，随后其下方淡入短标注，右侧对应的柱形同步生长到相应高度"

code_prompt: |
  【Manim 版本】
  当前渲染环境使用 Manim Community v0.20.1，一律按此版本的 API 生成代码，不要使用其他版本
  （尤其是网上常见的旧版教程/ManimGL）中存在但本版本已不存在的参数或方法。

  【高频报错点——生成代码前必须自查】
  - VMobject/Arrow/Line 等的 set_stroke() 不接受 dash_length / dashed_ratio，传入会报 "unexpected keyword argument"（set_stroke 只管 color/width/opacity 等描边样式，
    不负责虚线化）。这两个参数只属于虚线类的构造函数：
    画虚线请用 DashedLine(start, end, dash_length=..., dashed_ratio=...)，
    或用 DashedVMobject(some_vmobject, num_dashes=..., dashed_ratio=...) 包装已有对象；
    不要试图通过 set_stroke 把实线对象改成虚线。
  - Sector(...) 构造时只能传 radius（以及可选 angle/start_angle 等），
    禁止传 outer_radius 或 inner_radius——Sector 内部会以固定的
    inner_radius=0、outer_radius=radius 调用 AnnularSector，再传这些参数
    会导致 "got multiple values for keyword argument"；
    如需要环形扇形（内半径 > 0），请直接用
    AnnularSector(inner_radius=, outer_radius=, angle=, start_angle=)。

  【Manim 代码规范】

  渲染引擎已生成外层结构（from manim import *、Scene 类定义、construct() 等），code 字段只写 construct() 方法体内的代码片段：

        # === 镜头 0 ===
        <scene 0 的 code>
        # === 镜头 1 ===
        <scene 1 的 code>
        ...

  禁止在 code 里写 def construct、类定义或其他结构定义；禁止 import manim（环境已 from manim import *，且 np 可直接使用）。
  确需 math / random / itertools 等标准库时可直接写 import 语句，系统会自动把它提升到模块级，不算违规。

  【语义节拍时间翻译】
  - 按 beats 顺序维护镜头内的相对时间游标；前一 beat 的最终画面是后一 beat 的起始状态
  - animation_start_seconds 是动作开始锚点，animation_end_seconds 是该 beat 主要动作完成的最晚时间
  - 当前游标早于下一 beat 的 animation_start_seconds 时，只等待两者差值；禁止把这些等待集中到镜头末尾
  - 每个 beat 的 self.play(run_time=...) 总时长不得超过自己的动画窗口
  - 若窗口不足以容纳复杂动作，简化次要装饰，优先保证主要视觉结果在 speech_end_seconds 前出现
  - 不得在第一个 beat 中创建或完成后续 beats 才应出现的元素

  【动画窗口填充率（防止 PPT 感，与时长上限同等重要）】
  - 每个 beat 的动画时间（所有 run_time 之和，含错落间隔）必须覆盖该 beat
    窗口的 70% 以上；窗口内单次 self.wait 不得超过 1.0 秒
  - 禁止"一个短 play + 长 wait"的偷懒结构；一个 beat 至少拆成 2-3 次
    self.play：主动作 → 跟随标注/连线 → 强调，动作之间才允许短暂停留
  - 窗口时间富余时，通过拉长过程性动画消化：群体动画用 LaggedStart 并
    增大 lag_ratio、数值增长/曲线绘制延长 run_time、状态扫过放慢节奏；
    宁可让动作变慢变从容，也不要动作播完后干等
  - 计数、生长、扫过类动画的 run_time 应设为窗口的 40%-60%，
    而不是默认的 1 秒

  【动画时序规则】
  - 用 self.wait(n) 控制停留时长，单位秒
  - 每个镜头 code 的所有 self.play(run_time=...) 与 self.wait(...) 之和需与该镜头 estimated_duration_seconds 匹配（误差 ±1s 可接受）
  - 关键图形和结论必须至少保留到对应旁白讲完；禁止旁白尚未结束就清空画面
  - 渲染器会自动补齐镜头剩余时长。如果本镜头没有必要的退场或转场，代码末尾保持最终画面即可，不要添加 FadeOut 清场
  - rate_func 只能用 manim 顶层导出的名字（linear、smooth、there_and_back、rush_into、rush_from 等），ease 系列必须写完整形式 rate_functions.xxx（如 rate_functions.ease_in_out_sine），禁止裸写 ease_ 开头的名字

  【变量生命周期与跨镜头引用】
  - 前面镜头创建的元素，后续镜头直接用原变量名引用即可（系统会自动把跨镜头引用的变量提升为共享属性，如同所有镜头写在同一个函数里）
  - 需要长期保留、多次变形的重要元素（标题、坐标轴、核心图形）推荐显式写成 self.xxx（如 self.title = Text(...)），可读性和错误定位更好；镜头内的临时变量不要加 self.
  - 禁止在不同镜头对同一逻辑元素重复创建同名变量——后一个会覆盖前一个，退场时会拿错对象；复用元素用 Transform / ReplacementTransform / .animate
  - 元素默认可跨镜头保留；镜头边界不等于清场点，不要为了结束当前镜头而机械 FadeOut
  - 仅当元素完成叙事作用、即将被新内容替代或会遮挡后续重点时，才在合适的转场时机退场

  【清场规则（重要）】
  - 系统已在 Scene 上提供 self.clear_except(*keep)：淡出画面上除 keep 之外的全部对象；self.clear_except() 不带参数则清空整个画面
  - 需要"整体清场"或"只保留少数元素进入下一镜头"时，必须用 self.clear_except(要保留的对象...)，禁止手工枚举上一镜头的对象列表逐个 FadeOut——枚举容易漏对象、容易引用错名字
  - 定向让单个元素退场仍用 self.play(FadeOut(该元素))
  - clear_except 的 keep 参数必须传"当初整体添加进画面的那个对象"（如整个 VGroup），不要传它内部的子元素

  【画布安全区（重要）】
  - Manim 默认画布：14.2 × 8 单位（宽×高），坐标原点在中心
  - 安全区：x ∈ [-6.0, 6.0]，y ∈ [-3.5, 3.5]，距边缘至少 0.3 单位缓冲
  - 所有元素创建后必须确认坐标在安全区内，禁止超出此范围
  - 多元素布局用 VGroup(...).arrange() 或明确 .shift() 定位，不依赖默认位置叠加
  - 大型 VGroup 用 .scale_to_fit_width(11) 限制最大宽度

  【坐标轴（Axes）专项安全规则——高频溢出场景】
  Axes 是最容易导致内容溢出的对象，必须遵守以下规则：
  - 必须显式设置 x_length 和 y_length，禁止使用默认尺寸： axes = Axes(x_range=[0,10,1], y_range=[0,1,0.2], x_length=9, y_length=5)
  - 创建后必须立即用 .move_to(ORIGIN) 或 .shift() 定位，不依赖默认位置：axes.move_to(ORIGIN).shift(RIGHT * 0.5)  # 为左侧 y 轴标签留出空间
  - y 轴标签天然向左偏移约 1 单位，整体 Axes 须向右平移至少 0.8 单位，防止标签溢出左边缘：axes.shift(RIGHT * 0.8)  # y 轴标签最终 x 位置 ≈ axes 左边缘 x - 1.2，必须 ≥ -6.0
  - 轴标签用 font_size=22 以内，创建后检查 label.get_left()[0] ≥ -5.8、label.get_right()[0] ≤ 5.8
  - 图形（Graph/ParametricFunction）绘制范围必须在轴的 x_range/y_range 之内，不要超出轴域：graph = axes.plot(lambda x: 1/x, x_range=[0.1, 9.9])  # 严格在 x_range 内
  - 如果同一画面有标题或其他元素，Axes 整体缩小或位移，确保与其他元素无重叠且各自在安全区内

  【文字元素防溢出规则】
  - 所有 Text / MathTex 在 .play(Write/FadeIn...) 前必须确认 get_left()[0] ≥ -5.8 且 get_right()[0] ≤ 5.8
  - 长文字必须先 .scale() 到合适大小再定位，不要先定位再期望 font_size 自动控制宽度
  - 跨镜头保留的文字（如标题）在移动到新位置后同样必须满足安全区约束
  - .to_corner() / .to_edge() 自带 buff=0.5，安全；但 .move_to() / .shift() 到边缘位置时须手动验证不超界

  【坐标系规则（重要）——高频报错根源】
  - Manim 所有"点"均为三维 (x, y, z)，z 通常为 0；这是全局约束，无例外
  - 凡是传递坐标/顶点/路径点的地方，一律用 3 元素格式：[x, y, 0] 或 np.array([x, y, 0])
  - 严禁任何形式的 2D 坐标：[x, y]、np.array([x, y]) 均会导致 shape broadcast 错误
  - Axes 构造函数不支持 x_label / y_label 参数；先创建 axes，再用 axes.get_x_axis_label() / axes.get_y_axis_label()

  【文字渲染规则（重要）】
  - 所有中文、日文等非 ASCII 文字必须使用 Text()，禁止使用 MathTex() 或 Tex()
  - MathTex() / Tex() 仅用于纯英文/ASCII 数学公式（如 r"E=mc^2"、r"\frac{{1}}{{2}}"）
  - 中英文混排时，中文用 Text()，公式用 MathTex()，再用 VGroup 组合
  - 违反此规则会导致 LaTeX 编译报错使视频生成失败
  - Text() 一律不传 font 参数，使用渲染环境默认字体；渲染环境未安装"Source Han Serif SC"等
    具体字体族，显式指定不存在的 font 名只会产生警告且退回默认字体，没有实际效果，禁止编造字体名

  【禁止引用外部资源文件】
  - 禁止使用 ImageMobject(...) / SVGMobject(...) 加载任何图片或 SVG 路径（如 "heart"、"heart.svg"、
    图标库文件名等）；渲染环境中不存在任何外部素材文件，传入的路径一律找不到导致渲染失败
  - 一切图形（包括心形、箭头、图标等）必须用 Manim 内置几何图元和参数方程/贝塞尔路径拼出，
    例如心形可用 ParametricFunction 描点或用两个 Circle + Polygon/Triangle 组合模拟，
    不要假设存在现成的心形/图标资源

  【Group / VGroup 参数类型】
  - Group(...) / VGroup(...) 的位置参数只能是 Mobject 实例，禁止把数字、字符串等非 Mobject
    值当位置参数传入（如误把间距写成 Group(a, b, 0.5)）；间距、缓冲量等数值一律通过
    .arrange(buff=0.5) 或 .shift(...) 等关键字/链式方法设置，不要传给 Group/VGroup 构造函数本身

  【VGroup 双重定位（高频布局错乱根源）】
  - VGroup 内部子元素只用相对布局（.arrange() / 相对 .shift() / .next_to(兄弟元素)），
    整体位置由 VGroup 最后统一 .move_to() / .shift() 决定
  - 严禁子元素先用绝对坐标 .move_to(RIGHT*3+UP*2) 定位、随后又对整个 VGroup 再 .move_to()——
    两次定位叠加会使子元素飞出预期位置，是元素重叠/错位的高频来源
  - 自检：VGroup 构造式内出现绝对坐标 move_to 且组装后又整体 move_to 的，必须改写

  【动画表现力词汇表（优先于原始 FadeIn/直线位移）】
  visual_action 中的表现意图必须翻译成对应的 Manim 模式，禁止一律降级为 FadeIn + 直线 shift：
  - 数值增长/计数跳动 → ValueTracker + DecimalNumber + add_updater，
    例：tr = ValueTracker(0); num = DecimalNumber(0, num_decimal_places=0);
        num.add_updater(lambda m: m.set_value(tr.get_value()));
        self.play(tr.animate.set_value(37), run_time=2.0)；结束后必须 num.clear_updaters()
  - 【高频崩溃点】DecimalNumber 计数器严禁在同一个 self.play 中把入场动画（FadeIn/Create 等）
    和 tr.animate.set_value(...) 混在一起，例如错误写法：
    self.play(FadeIn(num), tr.animate.set_value(37))——
    入场瞬间 DecimalNumber 从初始值跳到目标值，若目标值位数与初始值不同（如 0→100 从1位变3位），
    渲染时会因始末子对象数量不一致抛出
    "ValueError: zip() argument 2 is longer than argument 1"（get_all_families_zipped 内部报错）
    导致整段代码验证失败。正确顺序：先 self.play(FadeIn(num)) 让 num 以初始值完成入场，
    该 play 结束后再挂 add_updater 并单独 self.play(tr.animate.set_value(37), ...) 执行计数；
    两个动作必须拆成先后两个 self.play，不能合并
  - 强调/脉冲/颤动 → Indicate(obj) / Circumscribe(obj) / Flash(obj) / Wiggle(obj)，
    不要手写 scale(1.04) 微缩放冒充强调
  - 标题/关键句文字 → Write(text) 逐笔书写；短标注才用 FadeIn
  - 曲线运动 → .animate.shift(...) 配 path_arc 参数、或 MoveAlongPath(obj, arc)，
    位移超过 2 单位的对象运动至少一半应带弧线，不要全部直线平移
  - 一拍内的"主动作→跟随→强调"微编排 → Succession(...) 或
    AnimationGroup(..., lag_ratio=0.6) 在同一 self.play 内衔接，比三个孤立短 play 更连贯
  - 元素替换 → ReplacementTransform / TransformMatchingShapes 优先于 FadeOut + FadeIn
  - 节奏质感 → run_time 较长的过程动画显式指定 rate_func（入场 smooth、
    强调 there_and_back、下落 rush_into），避免所有动作都是默认速率曲线

  【退场检查清单（每个镜头必须执行）】
  每个镜头代码开头，隐式维护画布存量列表，对每个存活元素判断：
  - 本镜头继续引用或保留 → 不退场，直接使用
  - 已完成使命且本镜头不再出现 → 镜头开头 FadeOut(run_time=0.5)
  - 位置与本镜头新元素重叠 → 镜头开头 FadeOut 或 ReplacementTransform
  - 背景性持续元素（如顶部标题） → 保留，除非叙事需要替换

  退场动画统一放在本镜头开头（先清场，再出新内容）。

  【代码注释格式】
  # === 镜头 N ===
  # 画布存量：[元素列表]
  # [元素] → 退场/保留，原因：[一句话]

  【重要自检】
