narrative_hint: |
  【Remotion 画面描述规范——弱技术层】
  description 和 beats[].visual_action 只写画面意图，由代码生成阶段翻译为 React/TSX 动画代码。禁止出现组件名、hook 名或代码语法。

  【语义表达要求】
  - description 概括整个镜头的视觉论证目标，visual_action 只描述当前 cue_text 对应的变化
  - 优先描述位置、数量、大小、连接、分裂、聚合、替换和状态变化，让动画承担解释功能
  - 前一 beat 的视觉结果应成为后一 beat 的输入，不在每个 beat 重新搭建画面
  - 跨镜头需要持续存在的元素在 description 中注明“作为共享视觉锚点延续”
  - 关键图形和结果至少保留到对应 cue_text 结束
  - 文字只保留关键词、数字、公式和短标注；先用图形解释，只在必要时使用公式

  【description 画面描述契约】
  description 是代码生成阶段唯一的画面依据，尽可能详尽，必须像施工图一样完整覆盖以下五要素，
  使用自然语言和相对位置词描述：
  ① 初始状态：镜头开始时画面上已有什么（来自上一镜头的保留元素及其位置）；
     若为清场新镜头则明确写"空画面，仅背景"。
  ② 元素清单：本镜头出现的每个视觉元素逐个写明——形状/类型、颜色（用视觉系统中的颜色名）、
     位置（九宫格方位：左上/顶部居中/中部/右下等，及相对其他元素的关系）、
     数量与排布（如"一排 15 个、水平等距、位于画面中部水平带"）。
  ③ 动画时序：元素以什么顺序、什么方式出现或变化
     （原地放大出现/淡入/生长绘制/变色/变幽灵态/放大强调），
     哪些动作同时发生、哪些先后发生，与哪个 beat 对齐。
  ④ 状态语义：每次视觉变化代表什么信息含义（如被排除→幽灵态、被选中→高亮放大），
     保证画面变化与旁白逻辑一一对应。
  ⑤ 结束定格：镜头结束时的最终画面构成，以及哪些元素需要保留给下一镜头。

  反例与正例：
  ✗ "展示多个候选人被逐一排除"
  ✓ "画面中部一排 12 个人物图标（主体色循环）已存在；随旁白从左到右前 5 个
     依次变为幽灵态（每个间隔约 0.2 秒），第 6 个同时放大高亮为金黄，
     其上方淡入小标注'当前最优'；结束定格保留整排状态供下一镜头使用"

code_prompt: |
  【Remotion 代码规范】

  渲染引擎为每个镜头生成一个具名 React 组件（如 _Scene0、_Scene1），code 字段即该组件的函数体。
  禁止在 code 里写 export、const _SceneN、const VideoScene 等外层定义——这些由渲染引擎自动生成。

  【语义节拍时间翻译】
  - 每个 beat 使用局部帧窗口：startFrame = Math.round(animation_start_seconds * fps)，endFrame = Math.round(animation_end_seconds * fps)
  - 每个 beat 的 interpolate/spring 只在自己的帧窗口内驱动，并对窗口外数值执行 clamp
  - 前一 beat 的最终状态默认延续为后一 beat 的输入，不要在每个 beat 开头重建整张画面
  - 不得只使用一个覆盖整个 _sceneDuration 的统一 spring 代替 beats 时间线
  - 主要视觉结果必须在对应 speech_end_seconds 换算的帧之前清晰可见

  可直接使用的 API（已由渲染引擎导入，无需 import）：
  AbsoluteFill、Sequence、Audio、staticFile、useCurrentFrame、useVideoConfig、interpolate、interpolateColors、spring

  画布尺寸：1280 × 720 px（16:9），所有元素坐标和尺寸以此为基准，禁止超出边界。
  SVG viewBox 统一使用 "0 0 1280 720"。

  【布局与坐标规范（重要）】
  坐标系：原点在左上角，x 向右，y 向下；画布中心为 (640, 360)。

  定位原则——先声明位置常量，再从常量推导所有相关坐标：
  const L_CX = 280, L_CY = 360, BOX_W = 200, BOX_H = 160;
  const R_CX = 1000, R_CY = 360;
  const lineX1 = L_CX + BOX_W / 2;
  const lineX2 = R_CX - BOX_W / 2;

  常用布局参考（不超出边界）：
  - 左右两列：左中心 x=320，右中心 x=960，各留 ≥80px 边距
  - 三列均分：x=213、640、1067
  - 上下两区：上中心 y=210，下中心 y=510
  - 全屏居中：cx=640，cy=360
  - 顶部标题栏：y=60，高度 80px；正文区：y=140–680

  连线/曲线必须从元素位置常量计算，禁止凭感觉估算 x/y 魔法数字。

  【节点与连线对齐规则（高频错位根源）】
  节点（circle/rect）和连线（line/path）必须共享同一套坐标常量，禁止分别硬编码各自的 x/y。

  【画面占用与居中规则（高频问题：偏移、重叠、留白过多）】
  - 主体内容的整体包围盒（bounding box）几何中心必须落在画布中心 (640, 360) 附近，禁止只把标题居中而正文/图形整体偏左或偏右
  - 多个并列元素（如多张卡片、多个节点）必须整体居中：先计算全部元素总宽度，再令 (1280 - 总宽度) / 2 作为起始 x，禁止从固定的左边距开始排列导致整体偏左
  - 副标题、注释文字必须在标题完全渲染的宽度之外另起一行或明显下移（y 间距 ≥ 主标题字号 × 1.2），禁止与标题同一 y 坐标导致文字重叠
  - 徽章/圆形标注（如百分比气泡）必须放在其依附元素的外侧或角上，并与依附元素的顶部/边缘保持 ≥ 20px 间距，禁止圆心与矩形边界重合导致遮挡
  - 主体图形/内容区域应占据画布至少 55%~70% 的有效宽高（画布 1280×720，除去顶部标题栏与边距后的可用区域），避免元素尺寸过小、四周留白过多导致画面空旷；卡片类元素宽度不小于 220px、高度不小于 260px
  - 新元素入场前，必须核对与已存在元素的坐标范围是否重叠；同一 beat 或跨 beat 延续的元素禁止在未淡出的情况下被新元素直接遮盖同一区域

  【帧与时序规则】
  - code 片段在 React 组件函数体内执行，可直接调用 Hooks：useCurrentFrame()、useVideoConfig()
  - useCurrentFrame() 返回当前镜头内的相对帧（从 0 开始）
  - 渲染引擎自动注入 const _sceneDuration = N;（N = estimated_duration_seconds × fps），可直接使用
  - 禁止自行声明 durationInFrames（会与 useVideoConfig() 解构冲突导致编译报错）；用 _sceneDuration 代替
  - 动画用 interpolate(frame, [inputRange], [outputRange]) 或 spring({ frame, fps }) 驱动
  - interpolate() 只能插值数字（opacity、translateY、scale、strokeDashoffset 等），禁止传入颜色字符串
  - 颜色过渡必须用 interpolateColors()
  - interpolate() 的 inputRange 必须严格单调递增

  【跨镜头共享元素】
  - 跨多个镜头持续存在的元素（背景、顶部标题栏）用 Sequence 包裹，放在最外层
  - 每个镜头的 code 只负责该镜头独有的内容
  - 镜头边界不等于清场点；关键元素保持到对应旁白结束，仅在叙事转折或替换时淡出

  【样式规范：静态 Tailwind + 动态内联样式】
  - 静态布局和视觉样式必须优先使用 className 和 Tailwind CSS，例如：
    className="absolute inset-0 flex items-center justify-center bg-slate-950 text-white"
  - 可使用任意值语法表达固定像素和颜色，例如：w-[220px]、top-[140px]、bg-[#0a0a0a]
  - 禁止动态拼接 Tailwind 类名，例如 `bg-${color}-500`；条件样式必须写出完整类名，例如：
    active ? "bg-blue-500" : "bg-slate-500"
  - Tailwind 只负责静态样式。opacity、transform、left、top、width、height、颜色等由 frame/interpolate/spring
    计算出的逐帧动态值，继续放在 style={{...}} 中
  - 禁止使用 Tailwind 的 animate-*、transition-* 和 duration-* 制作动画；所有动画必须由当前 frame
    和 Remotion API 驱动，保证任意帧可确定性渲染
  - style={{...}} 是 JS 对象，属性名必须用 camelCase，禁止 CSS kebab-case
  - SVG 的固定几何属性优先直接写为 JSX 属性；动态 strokeDashoffset、fill、stroke、transform 等可保留内联

  可直接使用的语义类（已全局定义，无需 import）：
  - scene-canvas：全画布绝对定位、裁剪、中文无衬线字体
  - scene-title：56px 主标题
  - scene-heading：36px 节点标签/图形说明
  - scene-body：28px 正文
  - scene-label：22px 小标注
  - scene-card：24px 圆角和 24px 内边距

  示例：
  return (
    <AbsoluteFill className="scene-canvas bg-slate-950 text-white">
      <div className="scene-title absolute left-20 top-14">核心结论</div>
      <div
        className="scene-card absolute bg-blue-500/20"
        style={{ opacity, transform: `translateY(${translateY}px) scale(${scale})` }}
      >
        <div className="scene-body">动态内容</div>
      </div>
    </AbsoluteFill>
  );

  【字体规范】
  - 主标题：scene-title（56px）
  - 节点标签/图形说明：scene-heading（36px）
  - 正文内容：scene-body（28px）
  - 小标注：scene-label（22px）
  - 特殊字号使用明确的 Tailwind 类，如 text-[44px]；禁止无字号的裸文字

  【视觉优先】
  - 除纯标题或总结镜头外，每个镜头至少包含一个承载知识含义的 SVG/CSS 图形动画
  - 用路径生长、位置移动、大小缩放、连接关系或形变动画推进讲解，避免静态文字页
  - 公式只保留支撑核心结论的关键公式，配合图形解释，避免公式堆砌
  - 每帧文字不超过 15 个汉字

  【文字渲染规则】
  - 所有文字用 div 或 text（SVG），使用 scene-* 语义类或 font-sans
  - 中文字体栈已由 font-sans 和 scene-* 类统一设置，无需在每个元素重复声明 fontFamily
  - scene-title 已包含 letterSpacing: 2px，scene-body/scene-label 已包含 letterSpacing: 0.5px
