services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: video_workflow
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d video_workflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: app
      POSTGRES_PWD: ${DB_PASSWORD:-password}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./temporal-config/dynamicconfig/development-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:latest
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    depends_on:
      - temporal
    ports:
      - "8080:8080"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  frontend:
    image: node:22-slim
    working_dir: /app
    environment:
      npm_config_store_dir: /pnpm-store
      CI: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_pnpm_store:/pnpm-store
    ports:
      - "5173:5173"
    command: sh -c "corepack enable && corepack prepare pnpm@10.27.0 --activate && pnpm install && pnpm exec vite --host 0.0.0.0"

  backend:
    build: ./backend
    working_dir: /app
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-password}@postgres:5432/video_workflow
      DATABASE_SYNC_URL: postgresql+psycopg2://app:${DB_PASSWORD:-password}@postgres:5432/video_workflow
      TEMPORAL_ADDRESS: temporal:7233
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      minio:
        condition: service_started
    command: sh -c "uv sync --frozen && uv run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    working_dir: /app
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-password}@postgres:5432/video_workflow
      DATABASE_SYNC_URL: postgresql+psycopg2://app:${DB_PASSWORD:-password}@postgres:5432/video_workflow
      TEMPORAL_ADDRESS: temporal:7233
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      minio:
        condition: service_started
    command: sh -c "uv sync --frozen && uv run python -m app.workers.combined_worker"

volumes:
  pgdata:
  minio_data:
  frontend_node_modules:
  frontend_pnpm_store:
  backend_venv:
